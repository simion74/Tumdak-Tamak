name: Release APK

# Push a tag like "v1.0.0" (git tag v1.0.0 && git push origin v1.0.0) and
# this creates a GitHub Release with the built APK attached, ready to
# download and install on a phone — no need to open Android Studio.
on:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.24.5"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Gradle wrapper files (FlutLab exports don't include them)
        run: |
          cd android
          mkdir -p gradle/wrapper
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v7.6.3/gradle/wrapper/gradle-wrapper.jar
          curl -sSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v7.6.3/gradlew
          curl -sSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v7.6.3/gradlew.bat
          chmod +x gradlew

      - name: Build release APK
        run: flutter build apk --release

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
