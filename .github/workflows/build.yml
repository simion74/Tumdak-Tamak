name: Build Android APK

# Runs automatically on every push/PR to main, and can also be triggered
# manually from the "Actions" tab in GitHub (workflow_dispatch) any time you
# just want a fresh APK without pushing a commit.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

# Pin the exact Flutter version here so a build today and a build next year
# behave the same. Bump this manually (and re-run) if you later upgrade
# packages in pubspec.yaml that need a newer Flutter/Dart SDK.
# NOTE: 3.19.6 was tried first but its bundled Dart SDK (3.3.4) is too old
# for file_picker >=8.1.0 (needs Dart >=3.4.0) — that's why this is now
# 3.24.5 (bundles Dart 3.5.x).
env:
  FLUTTER_VERSION: "3.32.8"

jobs:
  build-android:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Gradle wrapper files (FlutLab exports don't include them)
        # FlutLab strips the executable android/gradlew, gradlew.bat and
        # gradle-wrapper.jar from project exports. Instead of running
        # `gradle wrapper` (which depends on whatever Gradle version happens
        # to be pre-installed on the runner — that version changes over time
        # and a newer one can be too new to even evaluate this project's
        # older-style build.gradle files, which is exactly what broke here),
        # we fetch the exact wrapper files for the pinned version directly
        # from the Gradle project's own repo. This has nothing to do with
        # the runner's system Gradle at all, so it can't drift/break again.
        run: |
          cd android
          mkdir -p gradle/wrapper
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          curl -sSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew
          curl -sSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew.bat
          chmod +x gradlew

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Set up release signing key
        # Recreates the upload keystore and key.properties from GitHub Secrets
        # (Settings → Secrets and variables → Actions) so the release APK is
        # signed with the real upload key instead of the debug key. If these
        # secrets aren't set, key.properties won't exist and
        # android/app/build.gradle falls back to debug signing automatically.
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "UPLOAD_KEYSTORE_BASE64 secret not set — release APK will be signed with the debug key."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tumdak-tamak-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tumdak-tamak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

# iOS build job removed for now (not needed yet) — Android-only build above.
# If you want it back later, it's easy to re-add: a separate job with
# runs-on: macos-latest, the same Flutter setup, then
# `flutter build ios --release --no-codesign`.
