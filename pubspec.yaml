name: tumdak_tamak
description: "Tumdak-Tamak — traditional Santal drum instruments app (Tumdak, Tamak, Octapad, Group Music)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  cupertino_icons: ^1.0.6
  file_picker: ^8.1.2
  shared_preferences: ^2.2.2
  share_plus: ^7.2.2
  record: ^5.1.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icon/
    - assets/images/decor/
    - assets/sounds/

  fonts:
    - family: PlayfairDisplayBlack
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900
